<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - MediCare Plus</title>
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<!-- hidden until the admin check in admin.js passes -->
<body hidden>
  <header class="bar">
    <h1>MediCare Plus admin</h1>
    <nav id="tabs">
      <button data-tab="products" class="on">Products</button>
      <button data-tab="orders">Orders</button>
      <button data-tab="rx">Prescriptions</button>
    </nav>
    <a href="index.html">Back to store</a>
  </header>

  <main>
    <section id="stats" class="stats"></section>

    <section id="products" class="panel">
      <div class="tools">
        <input id="pSearch" type="search" placeholder="Search name, brand or category">
        <button id="addBtn" class="primary">Add product</button>
      </div>
      <div id="pTable" class="scroll"></div>
    </section>

    <section id="orders" class="panel" hidden>
      <div class="tools">
        <select id="oFilter">
          <option value="">All orders</option>
          <option>placed</option><option>confirmed</option><option>packed</option>
          <option>shipped</option><option>delivered</option><option>cancelled</option>
        </select>
      </div>
      <div id="oTable" class="scroll"></div>
    </section>

    <section id="rx" class="panel" hidden>
      <div class="tools">
        <select id="rFilter">
          <option value="">All prescriptions</option>
          <option selected>pending</option><option>approved</option><option>rejected</option>
        </select>
      </div>
      <div id="rTable" class="scroll"></div>
    </section>
  </main>

  <dialog id="pDialog">
    <form id="pForm">
      <h2 id="pTitle">Product</h2>
      <input type="hidden" name="id">
      <label>Name <input name="name" required></label>
      <div class="row">
        <label>Brand <input name="brand"></label>
        <label>Category <input name="cat" required></label>
      </div>
      <div class="row">
        <label>Price (₹) <input name="price" type="number" min="0" step="0.01" required></label>
        <label>MRP (₹) <input name="mrp" type="number" min="0" step="0.01" required></label>
        <label>Stock <input name="stock" type="number" min="0" step="1" required></label>
      </div>
      <div class="row">
        <label>Emoji <input name="emoji" maxlength="4"></label>
        <label>Image path or URL <input name="image"></label>
      </div>
      <label>Description <textarea name="description" rows="3"></textarea></label>
      <label>Tags (comma separated) <input name="tags"></label>
      <div class="row checks">
        <label><input type="checkbox" name="prescription"> Needs prescription</label>
        <label><input type="checkbox" name="active" checked> Visible in store</label>
      </div>
      <div class="actions">
        <button type="button" id="pCancel">Cancel</button>
        <button type="submit" class="primary">Save product</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
